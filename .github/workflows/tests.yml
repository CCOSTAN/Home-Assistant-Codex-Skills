name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install PyYAML
      - name: Dashboard validator tests
        run: python -m unittest discover -s homeassistant-dashboard-designer/tests -p "test_*.py"
      - name: YAML DRY verifier tests
        run: python -m unittest discover -s homeassistant-yaml-dry-verifier/tests -p "test_*.py"
      - name: Mermaid validator tests
        run: python -m unittest discover -s network-architecture-diagrammer/tests -p "test_*.py"
